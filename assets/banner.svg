<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.6" />
    </pattern>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      /* Dynamic Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(450px); opacity: 0; }
      }
      @keyframes diffStream {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 8s ease-in-out infinite; }
      .pulse-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .scanner-beam { animation: scanline 5s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Background Glowing Orbs (Dynamic Pulse) -->
  <circle class="pulse-bg" cx="150" cy="100" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glowCyan)" />
  <circle class="pulse-bg" cx="1050" cy="320" r="200" fill="#a855f7" opacity="0.14" filter="url(#glowPurple)" />
  <circle class="pulse-bg" cx="600" cy="390" r="140" fill="#6366f1" opacity="0.10" filter="url(#glowCyan)" />

  <!-- Decorative Animated Flow Streams (Diff Branching) -->
  <path d="M -50 320 Q 250 280 400 370 T 850 340 T 1250 380" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <path d="M -50 360 Q 200 410 500 330 T 950 390 T 1250 320" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="12 8" />

  <!-- Background Floating Mini Diff Cards (Strictly kept in background/flanks) -->
  <g class="floating-card-1" opacity="0.45">
    <!-- Left Background Diff Card -->
    <rect x="35" y="45" width="230" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <circle cx="55" cy="65" r="4" fill="#f43f5e" />
    <circle cx="68" cy="65" r="4" fill="#eab308" />
    <circle cx="81" cy="65" r="4" fill="#22c55e" />
    <text x="55" y="90" fill="#f43f5e" class="font-mono" font-size="11">- @@ -14,6 +14,8 @@</text>
    <text x="55" y="108" fill="#e11d48" class="font-mono" font-size="11">- const status = "pending";</text>
    <text x="55" y="126" fill="#22c55e" class="font-mono" font-size="11">+ const status = "reviewed";</text>
    <text x="55" y="142" fill="#22c55e" class="font-mono" font-size="11">+ await pr.autoMerge();</text>
  </g>

  <g class="floating-card-2" opacity="0.45">
    <!-- Right Background Review Card -->
    <rect x="935" y="45" width="230" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <circle cx="955" cy="65" r="4" fill="#f43f5e" />
    <circle cx="968" cy="65" r="4" fill="#eab308" />
    <circle cx="981" cy="65" r="4" fill="#22c55e" />
    <text x="955" y="90" fill="#38bdf8" class="font-mono" font-size="11">✓ Qodo PR-Agent: Approved</text>
    <text x="955" y="108" fill="#94a3b8" class="font-mono" font-size="11">AST Diff: 0 syntactic issues</text>
    <text x="955" y="126" fill="#22c55e" class="font-mono" font-size="11">● 3-way merge conflict clean</text>
    <text x="955" y="142" fill="#818cf8" class="font-mono" font-size="11">→ Difftastic AST match 100%</text>
  </g>

  <!-- FOREGROUND: Content Area (Guaranteed no obstruction) -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="-190" y="-17" width="380" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-165" cy="0" r="5" fill="#22c55e" />
      <text x="-148" y="5" fill="#e2e8f0" class="font-mono" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">GIT DIFF ENGINES &amp; CODE REVIEW SUITES</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" fill="url(#primaryTextGrad)" class="font-sans" font-size="44" font-weight="900" letter-spacing="-1">
      Git DIFF Utilities &amp; Code Review Tools
    </text>

    <!-- Subtitle -->
    <text x="0" y="202" fill="#f1f5f9" class="font-sans" font-size="20" font-weight="600" letter-spacing="0.2">
      Curated Catalog of Commercial Platforms, Terminal Differs &amp; Open-Source Forges
    </text>

    <!-- Tagline / Secondary Description -->
    <text x="0" y="235" fill="#94a3b8" class="font-sans" font-size="14.5" font-weight="400">
      Interactive AST Diffs • Visual 3-Way Merge • Self-Hosted Review Servers • AI-Assisted PR Automation
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 280)">
      <!-- Pill 1: delta / difftastic -->
      <g transform="translate(-360, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="0" y="4" fill="#38bdf8" class="font-mono" font-size="11.5" font-weight="600">⚡ delta / Difftastic</text>
      </g>
      <!-- Pill 2: Gerrit & ReviewBoard -->
      <g transform="translate(-180, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
        <text x="0" y="4" fill="#818cf8" class="font-mono" font-size="11.5" font-weight="600">🏛️ Gerrit / Phorge</text>
      </g>
      <!-- Pill 3: 3-Way Merge -->
      <g transform="translate(20, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
        <text x="0" y="4" fill="#c084fc" class="font-mono" font-size="11.5" font-weight="600">🔀 Meld / Beyond Compare</text>
      </g>
      <!-- Pill 4: AI PR Agents -->
      <g transform="translate(210, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
        <text x="0" y="4" fill="#4ade80" class="font-mono" font-size="11.5" font-weight="600">🤖 Qodo PR-Agent</text>
      </g>
      <!-- Pill 5: Terminal TUI -->
      <g transform="translate(370, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
        <text x="0" y="4" fill="#fbbf24" class="font-mono" font-size="11.5" font-weight="600">🖥️ gh-dash / Lazygit</text>
      </g>
    </g>

    <!-- Bottom Stats / Metadata Ribbon -->
    <g transform="translate(0, 350)">
      <rect x="-380" y="-16" width="760" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8" />
      <text x="0" y="5" fill="#cbd5e1" class="font-mono" font-size="12">
        <tspan fill="#38bdf8">10+ SaaS Platforms</tspan> • <tspan fill="#4ade80">15+ Open-Source Projects</tspan> • <tspan fill="#f43f5e">Free Tiers &amp; Pricing Included</tspan>
      </text>
    </g>
  </g>
</svg>
